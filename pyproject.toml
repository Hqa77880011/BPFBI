[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpfbi"
version = "0.1.0"
description = "Budgeted personalized federated building intelligence implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
bpfbi = "bpfbi.cli:main"

[tool.setuptools.packages.find]
include = ["bpfbi*"]
